services:
  postgres:
    image: postgres:16-alpine
    container_name: impactgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-impactgraph}
      POSTGRES_USER: ${DB_USERNAME:-impactgraph}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-impactgraph_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-impactgraph} -d ${DB_NAME:-impactgraph}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# =============================================================================
# ImpactGraph Backend - Development Profile (H2 in-memory)
# Used for local development and testing when PostgreSQL is not installed locally
# Activate via: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
# =============================================================================

spring.datasource.url=jdbc:h2:mem:impactgraph;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Local-only sample account and topology.  This is deliberately opt-in through
# the dev profile so a normal PostgreSQL/production startup never creates a
# known account.
demo.seeder.enabled=true

spring.application.name=impactgraph-backend

# ==============================================================================
# Database Configuration (PostgreSQL)
# Configured via environment variables; do NOT hardcode sensitive credentials.
# Environment variables:
#   SPRING_DATASOURCE_URL or DB_URL / DB_HOST / DB_PORT / DB_NAME
#   SPRING_DATASOURCE_USERNAME or DB_USERNAME
#   SPRING_DATASOURCE_PASSWORD or DB_PASSWORD
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:impactgraph}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${PORT:8080}

# Cross-Origin Resource Sharing (CORS) Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

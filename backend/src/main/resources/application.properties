spring.application.name=impactgraph-backend

# Optional import of local .env files if present (gitignored for sensitive credentials)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ==============================================================================
# Database Configuration (PostgreSQL)
# Configured via environment variables; do NOT hardcode sensitive credentials.
# Environment variables:
#   SPRING_DATASOURCE_URL or DB_URL / DB_HOST / DB_PORT / DB_NAME
#   SPRING_DATASOURCE_USERNAME or DB_USERNAME / POSTGRES_USER
#   SPRING_DATASOURCE_PASSWORD or DB_PASSWORD / POSTGRES_PASSWORD
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:impactgraph}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${POSTGRES_USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${PORT:8080}

# Cross-Origin Resource Sharing (CORS) Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT Configuration (secret MUST be set via environment variable; no hardcoded secret)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin provisioning: set via env to bootstrap the first admin account
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}


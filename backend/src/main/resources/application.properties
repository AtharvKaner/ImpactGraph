# =============================================================================
# ImpactGraph Backend - Application Configuration
# =============================================================================
# PostgreSQL is the production database. Credentials come from environment vars.
# See .env.example for required environment variable names.
# =============================================================================

server.port=8080

# PostgreSQL datasource (values from environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/impactgraph}
spring.datasource.username=${DB_USERNAME:impactgraph}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (secret MUST be set via environment variable)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - allow the Vite dev server by default
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.impactgraph=INFO
logging.level.org.springframework.security=WARN

# Admin provisioning: set via env to bootstrap the first admin account
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

spring.application.name=impactgraph-backend-test

# Test DataSource Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:impactgraph_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.port=0

# Test JWT secret (64+ characters, only used in tests)
jwt.secret=test-jwt-secret-key-that-is-at-least-sixty-four-characters-long-for-testing-only-do-not-use-in-production
jwt.expiration-ms=3600000

# CORS
cors.allowed-origins=http://localhost:5173

# Disable admin bootstrap in tests
admin.bootstrap.email=
admin.bootstrap.password=

# Disable automatic demo seeder in automated test suites
demo.seeder.enabled=false


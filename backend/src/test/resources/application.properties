# =============================================================================
# Test Configuration — H2 in-memory database
# No real PostgreSQL required for tests.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Test JWT secret (64+ characters, only used in tests)
jwt.secret=test-jwt-secret-key-that-is-at-least-sixty-four-characters-long-for-testing-only-do-not-use-in-production
jwt.expiration-ms=3600000

# CORS
cors.allowed-origins=http://localhost:5173

# Disable admin bootstrap in tests
admin.bootstrap.email=
admin.bootstrap.password=

logging.level.com.impactgraph=DEBUG
